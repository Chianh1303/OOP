<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let value = prompt("Enter a number");
    let numbers = [2,4,5,6,7,8,9,0];
    let index =-1;
    for (let i =0;i< numbers.length;i++){
        if (value == numbers[i]){
            index =i;

        }
    }
    if (index> -1){
        alert("value" + value + "found at" + index);
    }
    else {
        alert("value" + value +"not found")
    }
</script>
</body>
</html>
