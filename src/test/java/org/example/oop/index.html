<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trò chơi Cờ Caro 20x20</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
        }
        h1 { color: #333; }
        #status {
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        /* Khung chứa bàn cờ */
        #board {
            position: relative;
            width: 600px;  /* 20 cột * 30px */
            height: 600px; /* 20 dòng * 30px */
            background-color: #fff;
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        /* Định dạng một ô cờ */
        .cell {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cell:hover {
            background-color: #e6f7ff;
        }
        /* Màu sắc cho X và O */
        .x-player { color: #ff4d4f; }
        .o-player { color: #1890ff; }
    </style>
</head>
<body>

<h1>TRÒ CHƠI CỜ CARO</h1>
<div id="status">Lượt của: <span class="x-player">X</span></div>
<div id="board"></div>

<script>
    // --- CẤU HÌNH BAN ĐẦU ---
    const SIZE = 20;       // Bàn cờ 20x20
    const CELL_SIZE = 30;  // Mỗi ô rộng 30px
    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');

    let isXTurn = true;    // Mặc định X đi trước
    let isGameOver = false;

    // Bước 1: Dùng mảng 2 chiều để lưu giá trị (Trống: "", X: "X", O: "O")
    const matrix = [];
    for (let r = 0; r < SIZE; r++) {
        matrix[r] = new Array(SIZE).fill("");
    }

    // --- BƯỚC 1: VẼ BÀN CỜ ---
    function createBoard() {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');

                // Định vị tuyệt đối dựa trên dòng và cột
                cell.style.top = (r * CELL_SIZE) + 'px';
                cell.style.left = (c * CELL_SIZE) + 'px';

                // Lưu tọa độ vào thuộc tính data của thẻ để dùng ở Bước 2
                cell.dataset.row = r;
                cell.dataset.col = c;

                // Lắng nghe sự kiện click
                cell.addEventListener('click', handleCellClick);

                boardElement.appendChild(cell);
            }
        }
    }

    // --- BƯỚC 2: XỬ LÝ SỰ KIỆN CLICK CHUỘT ---
    function handleCellClick(event) {
        if (isGameOver) return;

        const cell = event.target;
        // Lấy số thứ tự dòng và cột tương ứng
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);

        // Nếu ô đã được đánh rồi thì bỏ qua
        if (matrix[r][c] !== "") return;

        // Điền giá trị hiện tại vào mảng và hiển thị lên giao diện
        const currentSign = isXTurn ? "X" : "O";
        matrix[r][c] = currentSign;
        cell.textContent = currentSign;
        cell.classList.add(isXTurn ? "x-player" : "o-player");

        // Bước 3: Kiểm tra người thắng cuộc
        if (checkWin(r, c, currentSign)) {
            statusElement.innerHTML = `🎉 Người chiến thắng là: <span class="${isXTurn ? 'x-player' : 'o-player'}">${currentSign}</span>!`;
            isGameOver = true;
            return;
        }

        // Đổi lượt chơi
        isXTurn = !isXTurn;
        statusElement.innerHTML = `Lượt của: <span class="${isXTurn ? 'x-player' : 'o-player'}">${isXTurn ? 'X' : 'O'}</span>`;
    }

    // --- BƯỚC 3: KIỂM TRA NGƯỜI THẮNG (Thuật toán duyệt 4 hướng) ---
    function checkWin(r, c, sign) {
        // 4 mảng vector đại diện cho: [hàng ngang, cột dọc, chéo xuôi, chéo ngược]
        const directions = [
            { dr: 0, dc: 1 },  // Ngang
            { dr: 1, dc: 0 },  // Dọc
            { dr: 1, dc: 1 },  // Chéo xuôi "\"
            { dr: 1, dc: -1 }  // Chéo ngược "/"
        ];

        for (let { dr, dc } of directions) {
            let count = 1; // Tính chính ô vừa đánh

            // Đếm tiến về một phía
            let i = 1;
            while (isValid(r + dr * i, c + dc * i) && matrix[r + dr * i][c + dc * i] === sign) {
                count++;
                i++;
            }

            // Đếm lùi về phía ngược lại
            let j = 1;
            while (isValid(r - dr * j, c - dc * j) && matrix[r - dr * j][c - dc * j] === sign) {
                count++;
                j++;
            }

            // Nếu đủ 5 ô liên tiếp cùng giá trị
            if (count >= 5) return true;
        }
        return false;
    }

    // Hàm phụ trợ kiểm tra tọa độ xem có nằm trong phạm vi bàn cờ 20x20 không
    function isValid(r, c) {
        return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
    }

    // Khởi chạy ứng dụng
    createBoard();
</script>
</body>
</html>
